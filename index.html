</head><body><canvas id="c"></canvas>
<script>
// ---- 00_core.js
'use strict';
// ===== HIGHRISE — core =====
const TAU = Math.PI * 2;
const M = 32;                 // world px per metre
const FLOOR_H = 3.2 * M;      // one storey
const PLAYER_FLOOR = 83;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const easeInOut = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
const sgn = v => v < 0 ? -1 : 1;

// Deterministic RNG so crowds are reproducible per seed
function RNG(seed) {
  let s = (seed >>> 0) || 1;
  s = Math.imul(s ^ (s >>> 16), 0x45d9f3b); s = Math.imul(s ^ (s >>> 16), 0x45d9f3b); s ^= s >>> 16; s = (s >>> 0) || 1;
  const r = () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
  r.range = (a, b) => a + r() * (b - a);
  r.int = (a, b) => Math.floor(r.range(a, b + 1));
  r.pick = arr => arr[Math.floor(r() * arr.length)];
  r.chance = p => r() < p;
  // weighted pick: [[item, weight], ...]
  r.weighted = arr => { let t = 0; for (const a of arr) t += a[1]; let x = r() * t; for (const a of arr) { x -= a[1]; if (x <= 0) return a[0]; } return arr[arr.length - 1][0]; };
  for (let i = 0; i < 4; i++) r();
  return r;
}
const rng = RNG(Date.now() & 0x7fffffff);

// ---- colour helpers (ink palette is deliberately muted, comic-book paper feel)
function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function rgbToHex(r, g, b) { return '#' + ((1 << 24) | (clamp(r | 0, 0, 255) << 16) | (clamp(g | 0, 0, 255) << 8) | clamp(b | 0, 0, 255)).toString(16).slice(1); }
function mix(a, b, t) { const A = hexToRgb(a), B = hexToRgb(b); return rgbToHex(lerp(A[0], B[0], t), lerp(A[1], B[1], t), lerp(A[2], B[2], t)); }
function shade(h, k) { const [r, g, b] = hexToRgb(h); return rgbToHex(r * k, g * k, b * k); }
const INK = '#0b0e1c';
const PAPER = '#f2ecdf';
const SHADOW = 'rgba(6,8,20,.45)';
let PAPER_SHADOW = false;

// ---- always night. One fixed palette, tuned so lit windows carry the scene.
const NIGHT = { skyTop: '#070a18', skyBot: '#1b2446', tint: '#22284a', tintK: .35, glow: .19, night: 1, hour: 22 };
function dayPalette() { return NIGHT; }

// ---- tiny event bus
const Bus = { _h: {}, on(e, f) { (this._h[e] = this._h[e] || []).push(f); }, emit(e, d) { (this._h[e] || []).forEach(f => f(d)); } };

// ---- 01_input.js
// ===== input =====
const Input = {
  keys: {}, pressed: {}, axisX: 0, axisY: 0, wheel: 0, pinch: 0, tap: null,
  stick: { active: false, id: -1, ox: 0, oy: 0, x: 0, y: 0, r: 46 },
  touches: {},
  init(canvas) {
    if (typeof window === 'undefined') return;
    window.addEventListener('keydown', e => {
      if (!this.keys[e.code]) this.pressed[e.code] = true;
      this.keys[e.code] = true;
      if (['ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault();
    });
    window.addEventListener('keyup', e => { this.keys[e.code] = false; });
    window.addEventListener('blur', () => { this.keys = {}; });
    canvas.addEventListener('wheel', e => { e.preventDefault(); this.wheel += e.deltaY; }, { passive: false });
    const pos = (t, r) => ({ x: t.clientX - r.left, y: t.clientY - r.top });
    canvas.addEventListener('touchstart', e => {
      e.preventDefault(); const r = canvas.getBoundingClientRect();
      for (const t of e.changedTouches) {
        const p = pos(t, r); this.touches[t.identifier] = p;
        if (!this.stick.active && p.x < r.width * .45) {
          Object.assign(this.stick, { active: true, id: t.identifier, ox: p.x, oy: p.y, x: p.x, y: p.y });
        } else this.tap = p;
      }
    }, { passive: false });
    canvas.addEventListener('touchmove', e => {
      e.preventDefault(); const r = canvas.getBoundingClientRect();
      const ids = Object.keys(this.touches);
      const before = ids.length >= 2 ? this._pinchDist() : 0;
      for (const t of e.changedTouches) {
        const p = pos(t, r); this.touches[t.identifier] = p;
        if (this.stick.active && t.identifier === this.stick.id) { this.stick.x = p.x; this.stick.y = p.y; }
      }
      if (ids.length >= 2 && before) { const after = this._pinchDist(); this.pinch += (after - before); }
    }, { passive: false });
    const end = e => {
      for (const t of e.changedTouches) {
        delete this.touches[t.identifier];
        if (this.stick.active && t.identifier === this.stick.id) this.stick.active = false;
      }
    };
    canvas.addEventListener('touchend', end); canvas.addEventListener('touchcancel', end);
    canvas.addEventListener('mousedown', e => { const r = canvas.getBoundingClientRect(); this.tap = { x: e.clientX - r.left, y: e.clientY - r.top }; });
    // gamepad polled in update
  },
  _pinchDist() { const v = Object.values(this.touches); if (v.length < 2) return 0; return dist(v[0].x, v[0].y, v[1].x, v[1].y); },
  update() {
    let x = 0, y = 0;
    if (this.keys.ArrowLeft || this.keys.KeyA) x -= 1;
    if (this.keys.ArrowRight || this.keys.KeyD) x += 1;
    if (this.keys.ArrowUp || this.keys.KeyW) y -= 1;
    if (this.keys.ArrowDown || this.keys.KeyS) y += 1;
    if (this.stick.active) {
      const dx = this.stick.x - this.stick.ox, dy = this.stick.y - this.stick.oy, d = Math.hypot(dx, dy);
      if (d > 6) { const k = Math.min(1, d / this.stick.r); x = dx / d * k; y = dy / d * k; }
    }
    if (typeof navigator !== 'undefined' && navigator.getGamepads) {
      const gp = navigator.getGamepads()[0];
      if (gp) {
        const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
        if (Math.abs(ax) > .18) x = ax; if (Math.abs(ay) > .18) y = ay;
        if (gp.buttons[0] && gp.buttons[0].pressed && !this._gpA) this.pressed.Space = true;
        this._gpA = gp.buttons[0] && gp.buttons[0].pressed;
        if (gp.buttons[6] && gp.buttons[6].value > .5) this.wheel += 40;
        if (gp.buttons[7] && gp.buttons[7].value > .5) this.wheel -= 40;
      }
    }
    this.axisX = clamp(x, -1, 1); this.axisY = clamp(y, -1, 1);
  },
  consume(code) { const v = !!this.pressed[code]; this.pressed[code] = false; return v; },
  endFrame() { this.pressed = {}; this.wheel = 0; this.pinch = 0; this.tap = null; },
  drawStick(ctx) {
    if (!this.stick.active) return;
    const s = this.stick;
    ctx.save(); ctx.globalAlpha = .35; ctx.lineWidth = 2; ctx.strokeStyle = INK; ctx.fillStyle = PAPER;
    ctx.beginPath(); ctx.arc(s.ox, s.oy, s.r, 0, TAU); ctx.stroke();
    const dx = s.x - s.ox, dy = s.y - s.oy, d = Math.hypot(dx, dy), k = Math.min(d, s.r);
    const kx = d ? dx / d * k : 0, ky = d ? dy / d * k : 0;
    ctx.beginPath(); ctx.arc(s.ox + kx, s.oy + ky, 18, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
};

// ---- 02_camera.js
// ===== camera =====
// zoom 1 => 1 world px per screen px. Player is ~56px tall at zoom 1 ("kind of small").
const ZOOM_STOPS = [
  { z: 2.4,  name: 'Close' },
  { z: 1.0,  name: 'Street' },
  { z: 0.42, name: 'Block' },
  { z: 0.15, name: 'Tower' },
  { z: 0.06, name: 'District' },
];
const Camera = {
  x: 0, y: 0, zoom: 1, tx: 0, ty: 0, tzoom: 1, w: 800, h: 600, dpr: 1,
  stopIndex: 1, follow: null, seq: null, seqT: 0, shake: 0,
  locked: false,           // true while a scene owns the camera (elevator panel etc)
  setSize(w, h, dpr) { this.w = w; this.h = h; this.dpr = dpr || 1; },
  snapTo(x, y, z) { this.x = this.tx = x; this.y = this.ty = y; if (z) this.zoom = this.tzoom = z; },
  setStop(i) { this.stopIndex = clamp(i, 0, ZOOM_STOPS.length - 1); this.tzoom = ZOOM_STOPS[this.stopIndex].z; },
  nearestStop() { let b = 0, bd = 1e9; ZOOM_STOPS.forEach((s, i) => { const d = Math.abs(Math.log(s.z) - Math.log(this.tzoom)); if (d < bd) { bd = d; b = i; } }); return b; },
  zoomBy(f) { this.tzoom = clamp(this.tzoom * f, ZOOM_STOPS[ZOOM_STOPS.length - 1].z, ZOOM_STOPS[0].z); this.stopIndex = this.nearestStop(); },
  // cinematic: list of {x,y,zoom,dur,hold,ease}
  play(steps, done) { this.seq = { steps, i: 0, t: 0, from: { x: this.x, y: this.y, z: this.zoom }, done }; },
  update(dt) {
    if (this.seq) {
      const s = this.seq, st = s.steps[s.i];
      s.t += dt;
      const dur = st.dur || 1.2, hold = st.hold || 0;
      const t = clamp(s.t / dur, 0, 1), e = (st.ease || easeInOut)(t);
      const tx = st.x !== undefined ? st.x : (this.follow ? this.follow.x : this.x);
      const ty = st.y !== undefined ? st.y : (this.follow ? this.follow.y - this.h * .22 / st.zoom : this.y);
      // interpolate in log-zoom so it feels linear to the eye
      this.zoom = Math.exp(lerp(Math.log(s.from.z), Math.log(st.zoom), e));
      this.x = lerp(s.from.x, tx, e); this.y = lerp(s.from.y, ty, e);
      if (s.t >= dur + hold) { s.i++; s.from = { x: this.x, y: this.y, z: this.zoom }; s.t = 0; if (s.i >= s.steps.length) { const d = s.done; this.tzoom = this.zoom; this.tx = this.x; this.ty = this.y; this.stopIndex = this.nearestStop(); this.seq = null; d && d(); } }
      return;
    }
    if (this.follow && !this.locked) {
      this.tx = this.follow.x;
      // when zoomed far out, centre on the building rather than the guy
      const far = smoothstep(0.35, 0.08, this.zoom);
      this.ty = lerp(this.follow.y - this.h * .22 / this.zoom, this.follow.y - 900 - this.h * .1 / this.zoom, far);
    }
    const k = 1 - Math.pow(0.001, dt);     // exp smoothing, framerate independent
    this.zoom = Math.exp(lerp(Math.log(this.zoom), Math.log(this.tzoom), k * .9));
    this.x = lerp(this.x, this.tx, k); this.y = lerp(this.y, this.ty, k);
    if (this.shake > 0) this.shake = Math.max(0, this.shake - dt * 3);
  },
  begin(ctx) {
    ctx.save();
    ctx.translate(this.w / 2, this.h / 2);
    ctx.scale(this.zoom, this.zoom);
    const sx = this.shake ? (Math.random() - .5) * 6 * this.shake : 0, sy = this.shake ? (Math.random() - .5) * 6 * this.shake : 0;
    ctx.translate(-this.x + sx, -this.y + sy);
  },
  end(ctx) { ctx.restore(); },
  // visible world rect
  bounds() { const hw = this.w / 2 / this.zoom, hh = this.h / 2 / this.zoom; return { x0: this.x - hw, y0: this.y - hh, x1: this.x + hw, y1: this.y + hh }; },
  toWorld(sx, sy) { return { x: (sx - this.w / 2) / this.zoom + this.x, y: (sy - this.h / 2) / this.zoom + this.y }; },
  stopName() { return ZOOM_STOPS[this.nearestStop()].name; },
};

// ---- 03_chargen.js
// ===== character generator =====
// Everything about a person is data. The rig (04) turns a spec into a drawn body.
const SKIN = ['#f4d5b8', '#ecc19c', '#e0ad86', '#c98e66', '#b07650', '#8f5a3c', '#6e4128', '#4b2c1c', '#f2c9c0', '#d9a883'];
const HAIR_COL = ['#1b1512', '#2c1d14', '#4a2f1c', '#6b4726', '#8a5a2b', '#b08040', '#d8b56a', '#e6d3a3', '#8c8c8c', '#d9d9d9', '#a63a2a', '#3a2a3a'];
const HAIR_STYLE = ['bald', 'buzz', 'short', 'side', 'curly', 'afro', 'long', 'bun', 'ponytail', 'bob', 'mohawk', 'slick'];
const FACIAL = ['none', 'stubble', 'mustache', 'goatee', 'beard', 'bigBeard'];
const HATS = ['none', 'cap', 'capBack', 'beanie', 'fedora', 'bucket', 'hardhat', 'beret', 'sunhat', 'cowboy', 'trilby'];
const GLASSES = ['none', 'round', 'square', 'shades'];
const TOPS = ['tshirt', 'hoodie', 'shirt', 'blazer', 'suit', 'coat', 'tank', 'dress', 'gown', 'blouse', 'sweater', 'vest', 'jacket', 'tracksuit', 'rags'];
const BOTTOMS = ['jeans', 'slacks', 'shorts', 'skirt', 'pencil', 'sweatpants', 'chinos', 'none'];
const SHOES = ['sneakers', 'dress', 'heels', 'boots', 'sandals', 'flats', 'workboots'];
const ACCESSORIES = ['none', 'briefcase', 'purse', 'phone', 'coffee', 'backpack', 'umbrella', 'cane', 'bag', 'clutch', 'newspaper'];
const CLOTH = {
  neutral: ['#2b2f3a', '#3d4150', '#5a5f6b', '#8a8e96', '#c9c6bc', '#e8e3d6', '#4a3b2f', '#7a6b5a'],
  bright: ['#b0413e', '#d97a3a', '#d9b23a', '#3e8a5b', '#2f6f9f', '#5a4a9f', '#a3457f', '#2a8a8a'],
  suit: ['#1e2230', '#2b2e3e', '#3a3f52', '#4a4a4a', '#5a4a3a', '#1f2f3f', '#6a6a70'],
  fancy: ['#8a1f3d', '#1d1d24', '#c9a24a', '#3a6a9a', '#d94a6a', '#2e7a6a', '#e8e0d0', '#5a2a7a', '#c0392b'],
  pale: ['#f0ece2', '#e9dfd0', '#d7e3ee', '#f3d9d0', '#e3ecd7', '#f5f0e0'],
  rag: ['#5a5245', '#6e6152', '#4f4a44', '#7c6f5a', '#3f3a34'],
};

// archetype: what kind of person walks these streets
const ARCHETYPES = {
  everyman: { w: 6 }, business: { w: 5 }, fancy: { w: 3 }, casual: { w: 5 }, worker: { w: 2 },
  jogger: { w: 2 }, elder: { w: 2 }, tourist: { w: 2 }, hipster: { w: 2 }, student: { w: 3 },
};

function genCharacter(seed, forceArch, opts) {
  const r = RNG(seed);
  opts = opts || {};
  const arch = forceArch || r.weighted(Object.keys(ARCHETYPES).map(k => [k, ARCHETYPES[k].w]));
  const gender = opts.gender || (r.chance(.5) ? 'm' : 'f');
  const age = arch === 'elder' ? r.range(.75, 1) : arch === 'student' ? r.range(.05, .25) : r.range(.15, .7);
  const height = (gender === 'm' ? r.range(1.66, 1.92) : r.range(1.55, 1.80)) * (arch === 'elder' ? .96 : 1);
  const build = r.range(.85, 1.25) * (arch === 'jogger' ? .92 : 1);
  const skin = r.pick(SKIN);
  const c = {
    seed, arch, gender, age, height, build, skin,
    hair: { style: 'short', color: r.pick(HAIR_COL) },
    facial: 'none', hat: 'none', glasses: 'none',
    top: { type: 'tshirt', color: r.pick(CLOTH.neutral), color2: r.pick(CLOTH.pale) },
    bottom: { type: 'jeans', color: r.pick(CLOTH.neutral) },
    shoes: 'sneakers', shoeColor: r.pick(['#1c1a17', '#3a3a3a', '#e8e3d6', '#6b4726', '#b0413e']),
    accessory: 'none', tie: null, walkSpeed: r.range(1.0, 1.4) * M, sway: r.range(.6, 1.3),
    face: { eye: r.int(0, 2), brow: r.int(0, 2), nose: r.int(0, 2), lips: false },
    heels: false, skirt: null,
    // gait: how this particular body carries itself
    gait: { slouch: r.range(-.07, .10), headTilt: r.range(-.12, .18), armSwing: r.range(.45, 1.5), stride: r.range(.8, 1.2),
      bounce: r.range(.3, 1.8), cadence: r.range(.85, 1.2), kneeLift: r.range(.6, 1.4), sway: r.range(0, 1), idle: r.pick(['idle', 'idle', 'idleShift', 'pockets', 'idleLook']) },
  };
  if (age > .7) { c.hair.color = r.pick(['#8c8c8c', '#d9d9d9', '#bfb8ae', '#e8e6e0']); c.walkSpeed *= .6; c.gait.slouch += .12; c.gait.stride *= .7; c.gait.armSwing *= .6; c.gait.bounce *= .5; c.gait.headTilt += .15; }
  // hair by gender/age
  if (gender === 'm') {
    c.hair.style = age > .6 && r.chance(.45) ? r.pick(['bald', 'buzz', 'side']) : r.weighted([['short', 5], ['buzz', 3], ['side', 3], ['curly', 2], ['afro', 1], ['long', 1], ['bun', 1], ['slick', 2], ['mohawk', .3], ['bald', 1]]);
    c.facial = r.weighted([['none', 5], ['stubble', 3], ['mustache', 1], ['goatee', 1.5], ['beard', 2], ['bigBeard', .8]]);
  } else {
    c.hair.style = r.weighted([['long', 5], ['bob', 3], ['ponytail', 3], ['bun', 3], ['curly', 2], ['afro', 1.5], ['short', 1.5], ['side', 1]]);
    c.face.lips = r.chance(.75);
  }
  c.glasses = r.weighted([['none', 8], ['round', 1], ['square', 1.2], ['shades', 1]]);
  // outfit by archetype
  const pick = arr => r.pick(arr);
  switch (arch) {
    case 'business':
      c.top = { type: gender === 'm' ? 'suit' : r.pick(['blazer', 'suit']), color: pick(CLOTH.suit), color2: pick(CLOTH.pale) };
      c.bottom = { type: gender === 'm' ? 'slacks' : r.pick(['pencil', 'slacks']), color: c.top.color };
      c.shoes = gender === 'm' ? 'dress' : r.pick(['heels', 'flats']);
      c.shoeColor = '#1c1a17';
      c.tie = gender === 'm' ? pick(['#7a1f2d', '#1f3a7a', '#3a6a3a', '#c9a24a', '#2b2b2b']) : null;
      c.accessory = r.weighted([['briefcase', 4], ['phone', 3], ['coffee', 3], ['none', 2], ['bag', 1]]);
      c.hat = r.chance(.08) ? 'fedora' : 'none';
      c.walkSpeed *= 1.2; c.gait.slouch -= .08; c.gait.armSwing *= 1.2; c.gait.headTilt -= .08; c.gait.stride *= 1.1;
      break;
    case 'fancy':
      if (gender === 'f') {
        c.top = { type: r.pick(['dress', 'gown', 'dress']), color: pick(CLOTH.fancy), color2: pick(CLOTH.fancy) };
        c.bottom = { type: 'none', color: c.top.color };
        c.shoes = 'heels'; c.shoeColor = r.pick(['#1c1a17', '#c0392b', '#c9a24a', '#e8e3d6']);
        c.accessory = r.weighted([['clutch', 4], ['purse', 3], ['phone', 2], ['none', 1]]);
        c.hat = r.chance(.12) ? 'sunhat' : 'none';
        c.hair.style = r.pick(['long', 'bun', 'bob', 'long']);
      } else {
        c.top = { type: 'suit', color: pick(['#1d1d24', '#2b2b3a', '#3a2a2a', '#4a4a5a']), color2: '#f5f0e0' };
        c.bottom = { type: 'slacks', color: c.top.color }; c.shoes = 'dress'; c.tie = pick(['#1c1a17', '#7a1f2d', '#c9a24a']);
        c.accessory = r.pick(['none', 'phone', 'none']); c.hair.style = r.pick(['slick', 'side', 'short']);
      }
      c.walkSpeed *= .9; c.gait.slouch = -.1; c.gait.headTilt = -.12; c.gait.stride *= .85; c.gait.bounce *= .5; c.gait.sway = 1;
      break;
    case 'worker':
      c.top = { type: r.pick(['vest', 'shirt', 'jacket']), color: r.pick(['#e0a020', '#e07020', '#2f6f9f', '#5a5f6b']), color2: pick(CLOTH.neutral) };
      c.bottom = { type: r.pick(['jeans', 'chinos']), color: pick(['#3d4150', '#7a6b5a', '#4a3b2f']) };
      c.shoes = 'workboots'; c.shoeColor = '#6b4726'; c.hat = r.weighted([['hardhat', 5], ['cap', 3], ['none', 2]]);
      c.accessory = r.pick(['none', 'coffee', 'none', 'bag']);
      break;
    case 'jogger':
      c.top = { type: r.pick(['tank', 'tshirt', 'tracksuit']), color: pick(CLOTH.bright), color2: pick(CLOTH.pale) };
      c.bottom = { type: r.pick(['shorts', 'sweatpants']), color: pick(CLOTH.neutral) };
      c.shoes = 'sneakers'; c.shoeColor = pick(CLOTH.bright); c.hat = r.chance(.3) ? 'capBack' : 'none';
      c.hair.style = gender === 'f' ? 'ponytail' : c.hair.style; c.walkSpeed *= 2.4; c.run = true; c.gait.armSwing = 1; c.gait.slouch = .1;
      break;
    case 'elder':
      c.top = { type: r.pick(['sweater', 'coat', 'shirt', 'blazer']), color: pick(CLOTH.neutral), color2: pick(CLOTH.pale) };
      c.bottom = { type: r.pick(['slacks', 'chinos', gender === 'f' ? 'skirt' : 'slacks']), color: pick(CLOTH.neutral) };
      c.shoes = r.pick(['dress', 'flats', 'sneakers']); c.hat = r.weighted([['none', 5], ['fedora', 2], ['cap', 1], ['beret', 1], ['trilby', 1]]);
      c.accessory = r.weighted([['cane', 4], ['bag', 2], ['newspaper', 2], ['none', 3]]);
      break;
    case 'tourist':

// ===== crowd: lots of people, moving fast =====
class Crowd {

    const N = count || (city.ch ? city.ch.crowd : 180);
    for (let i = 0; i < N; i++) {
      const a = new Actor(genCharacter(1000 + i + (city.dir === 'ns' ? 5000 : 0) + (city.i || 0) * 300));
      a.x = r.range(x0, x1); a.y = GROUND + r.range(6, WALK_DEPTH); a.facing = r.chance(.5) ? 1 : -1; a.dir = a.facing;
      a.wait = r.range(0, 3); a.spec.walkSpeed *= 1.35; this.npcs.push(a);
    }
    for (let i = 0; i < (city.ch ? city.ch.cars : 26); i++) this.cars.push(new Car(i % 2, r.range(x0, x1), 500 + i + (city.i || 0) * 90 + (city.dir === 'ns' ? 1000 : 0)));
  }

      if (a.wait > 0) { a.wait -= dt; a.vx = a.vy = 0; }

    const spd = .9 + this.round * .12; this.cursor += this.dir * spd * dt; if (this.cursor > 1) { this.cursor = 1; this.dir = -1; } if (this.cursor < 0) { this.cursor = 0; this.dir = 1; }

    ctx.fillStyle = 'rgba(255,230,180,.06)'; for (let i = 0; i < 3; i++) ctx.fillRect(W * (.2 + i * .3) - 100, 0, 200, cy);

    cut(ctx, this.flash > 0 ? '#7dff7a' : this.flash < 0 ? '#ff5a4a' : '#f2ecdf', bx + this.cursor * bw - 4, by - 4, 8, 42, 3);
    ctx.fillStyle = '#f2ecdf'; ctx.font = `bold 14px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(this.done ? 'Clocking out…' : `Box ${Math.min(10, this.round + 1)} / 10   ·   ${this.hits} clean`, W / 2, by + 56);
  },
};

// ---- 08_scenes.js
// ===== scenes =====
// Each scene owns a coordinate space with the floor at y=0. Interiors are side-view rooms.
const ROOM_DEPTH = 26;
const cut = (ctx, col, x, y, w, h, r) => { ctx.fillStyle = col; ctx.beginPath(); ctx.roundRect(x, y, w, h, r || 0); ctx.fill(); };
const shadowCut = (ctx, col, x, y, w, h, r) => { cut(ctx, 'rgba(0,0,0,.35)', x + 4, y + 5, w, h, r); cut(ctx, col, x, y, w, h, r); };
const glow = (ctx, x, y, r, col, a) => { const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, col.replace('A', a || .35)); g.addColorStop(1, col.replace('A', 0)); ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); };
const WARM = 'rgba(255,225,160,A)';
const WARM_L = '255,225,160';

function roomBase(ctx, w, wall, floor, trim, opt) {
  opt = opt || {};
  const seed = opt.seed || (w * 31 + wall.length * 7);
  Tex.paint(ctx, opt.wallTex || 'plaster', seed, wall, -200, -FLOOR_H * 2.4, w + 400, FLOOR_H * 2.4);
  cut(ctx, shade(wall, .82), -200, -FLOOR_H * 2.4, w + 400, FLOOR_H * .6);
  Tex.paint(ctx, opt.floorTex || 'wood', seed + 5, floor, -200, 0, w + 400, ROOM_DEPTH + 8);
  // scuffs along the bottom of the wall and grime in the corners
  Tex.streaks(ctx, -200, -FLOOR_H * 1.1, w + 400, FLOOR_H * .5, seed, .07);
  const g = ctx.createLinearGradient(0, -80, 0, 0); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.18)'); ctx.fillStyle = g; ctx.fillRect(-200, -80, w + 400, 80);
  cut(ctx, trim || shade(wall, .7), -200, -10, w + 400, 10);
  cut(ctx, '#05060c', -200, ROOM_DEPTH + 8, w + 400, 4000);
}

// ---------- ELEVATOR PANEL + RIDE ----------
const ElevatorScene = {
  name: 'elevator', where: 'Elevator', noZoom: true, sel: 83, mode: 'panel', t: 0, from: 83, to: 83, cur: 83, doors: 0,
  enter(G, from) { this.mode = 'panel'; this.t = 0; this.doors = 1; Camera.locked = true; this.sel = G.floor === 83 ? 0 : 83; },
  floors() { const f = [0]; for (let i = 2; i <= TOWER.floors; i++) f.push(i); f.push(99); return f; },
  label(f) { return f === 0 ? 'L' : f === 99 ? 'R' : String(f); },
  update(G, dt) {
    this.t += dt;
    if (this.mode === 'panel') {
      const list = this.floors(); let i = list.indexOf(this.sel);
      const cols = Camera.w < 700 ? 8 : 12;
      if (Input.consume('ArrowRight') || Input.consume('KeyD')) i = Math.min(list.length - 1, i + 1);
      if (Input.consume('ArrowLeft') || Input.consume('KeyA')) i = Math.max(0, i - 1);
      if (Input.consume('ArrowDown') || Input.consume('KeyS')) i = Math.min(list.length - 1, i + cols);
      if (Input.consume('ArrowUp') || Input.consume('KeyW')) i = Math.max(0, i - cols);
      this.sel = list[i];
      if (Input.consume('Space') || Input.consume('Enter') || Input.consume('KeyE')) this.pick(G, this.sel);
      if (Input.consume('Escape')) G.go(G.elevatorFrom, 'elevator');
      if (Input.tap) { const id = UI.hit(Input.tap); if (id && id.startsWith('fl:')) { this.pick(G, parseInt(id.slice(3))); Input.tap = null; } else if (id === 'esc') { G.go(G.elevatorFrom, 'elevator'); Input.tap = null; } }
    } else if (this.mode === 'ride') {
      // doors close, travel, doors open
      const dur = this.rideDur;
      if (this.t < .8) this.doors = 1 - this.t / .8;
      else if (this.t < .8 + dur) { const k = easeInOut((this.t - .8) / dur); this.cur = Math.round(lerp(this.from, this.to, k)); Camera.shake = .15; }
      else if (this.t < 1.6 + dur) { this.cur = this.to; this.doors = (this.t - .8 - dur) / .8; if (!this.dinged) { this.dinged = true; UI.say('Ding.', 1); } }
      else { G.floor = this.to; G.go(this.to === 0 ? 'lobby' : this.to === 99 ? 'roof' : 'hall', 'elevator'); }
    }
    G.player.vx = 0; G.player.update(dt);
  },
  pick(G, f) { if (f === G.floor) { UI.say('You are already here.', 1.2); return; } this.from = G.floor === 99 ? TOWER.floors + 1 : G.floor; this.to = f; this.cur = this.from; this.mode = 'ride'; this.t = 0; this.dinged = false; this.rideDur = clamp(Math.abs((f === 99 ? TOWER.floors + 1 : f) - this.from) * .045, 1.2, 4.5); },
  draw(G, ctx, cam, pal) {
    const W = cam.w, H = cam.h;
    ctx.fillStyle = '#1a1826'; ctx.fillRect(0, 0, W, H);
    // cabin
    const cw = Math.min(W - 40, 520), cx = W / 2 - cw / 2, top = 60, bot = H - 40;
    shadowCut(ctx, '#3a3348', cx, top, cw, bot - top, 6);
    cut(ctx, '#2a2436', cx + 16, top + 16, cw - 32, bot - top - 32, 4);
    // door opening (left/right leaves)
    const dw = (cw - 32) / 2 * this.doors;
    cut(ctx, '#1a1620', cx + 16, top + 16, cw - 32, bot - top - 32);
    cut(ctx, '#8a7a5a', cx + 16, top + 16, dw, bot - top - 32); cut(ctx, '#8a7a5a', cx + cw - 16 - dw, top + 16, dw, bot - top - 32);
    // floor indicator
    cut(ctx, '#0a0a12', cx + cw / 2 - 60, top + 20, 120, 34, 4); ctx.fillStyle = '#ff9a3a'; ctx.font = `bold 24px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(this.mode === 'ride' ? this.label(this.cur > TOWER.floors ? 99 : this.cur) : this.label(G.floor === 99 ? 99 : G.floor), cx + cw / 2, top + 37);
    if (this.mode === 'ride') { ctx.fillStyle = '#ffd36a'; ctx.font = `14px ${FONT}`; ctx.fillText(this.to > (this.cur > TOWER.floors ? 99 : this.cur) ? '▲' : '▼', cx + cw / 2 + 48, top + 37); }
    // the guy inside
    ctx.save(); ctx.translate(cx + cw / 2, bot - 60); ctx.scale(2.4, 2.4); const p = G.player; const sx = p.x, sy = p.y, sf = p.facing; p.x = 0; p.y = 0; p.facing = 1; inkW(2.4); p.draw(ctx, 2.4); p.x = sx; p.y = sy; p.facing = sf; ctx.restore();
    if (this.mode === 'panel') {
      // button panel overlay on the right wall
      const list = this.floors(), cols = W < 700 ? 8 : 12, bw = W < 700 ? 34 : 38, gap = 6;
      const pw = cols * (bw + gap) + 20, ph = Math.ceil(list.length / cols) * (bw + gap) + 60;
      const px = W / 2 - pw / 2, py = Math.max(top + 70, H / 2 - ph / 2);
      shadowCut(ctx, '#b8a068', px, py, pw, ph, 8);

  update(G, dt) {

    Econ.init(this); this.scene = ApartmentScene; this.floor = PLAYER_FLOOR; this.resize(); Input.init(canvas); ApartmentScene.enter(this, 'wake');

  resize() { const dpr = Math.min(2, (typeof window !== 'undefined' && window.devicePixelRatio) || 1); const w = (typeof window !== 'undefined' ? window.innerWidth : this.canvas.width), h = (typeof window !== 'undefined' ? window.innerHeight : this.canvas.height); this.canvas.width = w * dpr; this.canvas.height = h * dpr; if (this.canvas.style) { this.canvas.style.width = w + 'px'; this.canvas.style.height = h + 'px'; } Camera.setSize(w, h, dpr); },
  startIntro() {

  },
  updateIntro(dt) {
    const C = this.cinema, p = this.player, B = ApartmentScene.bed;
    C.t += dt;
    const go = (step, at, fn) => { if (C.step === step && C.t >= at) { C.step++; fn(); } };

  frame(t) { const dt = Math.min(.05, (t - this.last) / 1000); this.last = t; this.update(dt); this.draw(); requestAnimationFrame(t => this.frame(t)); },
  lookText() { const l = this.look || 0; return l < 15 ? 'Rough. Hoodie, stubble, tired eyes.' : l < 35 ? 'Presentable. Barely.' : l < 60 ? 'Not bad. People might look twice.' : l < 85 ? 'Sharp. You look like money.' : 'Immaculate.'; },
  // ---- streets
  setStreet(st) { this.city = st; if (!st.crowd) st.crowd = new Crowd(st); if (!st.coins) { const r = RNG(st.id.length * 91 + st.i * 7 + (st.dir === 'ns' ? 3 : 0)); st.coins = []; for (let i = 0; i < (st.ch && st.ch.crowd > 140 ? 11 : 6); i++) st.coins.push({ x: r.range(st.x0, st.x1), y: GROUND + r.range(8, WALK_DEPTH), v: r.pick([1, 1, 2, 5]), got: false }); }
    if (!st.bottleSpots) { const r = RNG(st.i * 13 + 5); st.bottleSpots = []; if (st.feature === 'industrial' || st.feature === 'construction' || st.feature === 'market') for (let i = 0; i < 8; i++) st.bottleSpots.push({ x: r.range(st.x0 + 200, st.x1 - 200), y: GROUND + r.range(10, WALK_DEPTH), got: false }); } },
  // night runs 8pm -> 5am over about 14 real minutes; the streets empty out after midnight and fill again toward dawn

    if (Shop.open) { Shop.update(this); Input.endFrame(); return; }
    const p = this.player;
    if (!this.scene.noZoom && !Camera.seq) {
      if (Input.wheel) Camera.zoomBy(Math.pow(1.0018, -Input.wheel));
      if (Input.pinch) Camera.zoomBy(Math.pow(1.01, Input.pinch));
      if (Input.consume('KeyZ') || Input.consume('Equal')) Camera.setStop(Camera.stopIndex - 1);
